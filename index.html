<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạp Hóa Web Scanner Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ZXing JS Library CDN -->
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 p-4 font-sans max-w-md mx-auto min-h-screen pb-10">

  <header class="mb-4 text-center">
    <h1 class="text-xl font-bold text-blue-600 flex items-center justify-center gap-2">
      🛒 Tạp Hóa Web Scanner Pro
    </h1>
    <p class="text-xs text-gray-500">Tối ưu quét mã vạch & Quản lý đơn hàng</p>
  </header>

  <!-- Khung Viewport Camera -->
  <div class="bg-black rounded-xl overflow-hidden relative mb-3 shadow-lg h-60 flex items-center justify-center border-2 border-blue-500/30">
    <video id="video" class="w-full h-full object-cover"></video>
    
    <!-- Khung ngắm & vạch laser -->
    <div id="scanner-overlay" class="absolute inset-0 pointer-events-none hidden">
      <div class="w-full h-full border-2 border-dashed border-white/40 rounded-xl relative">
        <div class="laser-line"></div>
      </div>
    </div>

    <!-- Trạng thái camera -->
    <div id="scan-status" class="absolute bottom-2 left-2 bg-black/75 text-white text-xs px-3 py-1 rounded-full backdrop-blur-sm z-10">
      🔴 Chưa bật camera
    </div>
  </div>

  <!-- Chọn Camera & Nút điều khiển -->
  <div class="space-y-2 mb-4">
    <select id="camera-select" class="w-full bg-white border text-xs rounded-lg p-2 font-medium text-gray-700 outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">⏳ Đang tải danh sách camera...</option>
    </select>

    <div class="flex gap-2">
      <button id="start-btn" onclick="startScan()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-semibold text-sm transition shadow">
        📷 Bật Camera Quét
      </button>
      <button id="stop-btn" onclick="stopScan()" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-lg font-semibold text-sm transition shadow hidden">
        ⏹ Dừng Camera
      </button>
      <button id="torch-btn" onclick="toggleTorch()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 rounded-lg font-semibold text-sm transition shadow hidden">
        💡 Flash
      </button>
    </div>
  </div>

  <!-- Nhập mã thủ công & Mã vừa quét -->
  <div class="bg-white p-3 rounded-lg shadow-sm border mb-4">
    <div class="flex justify-between items-center mb-2">
      <span class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">Mã vạch gần nhất:</span>
      <span id="scan-badge" class="hidden text-xs bg-green-100 text-green-700 font-semibold px-2 py-0.5 rounded-full">Đã nhận mã</span>
    </div>
    <div id="result-code" class="font-mono text-base font-bold text-blue-600 break-all mb-3">---</div>

    <!-- Ô tìm kiếm & Nút thêm dữ liệu thủ công -->
    <div class="flex gap-1.5 pt-2 border-t">
      <input type="text" id="manual-barcode-input" placeholder="Nhập mã vạch..." class="flex-1 border rounded-lg px-2.5 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="handleManualSearch()" class="bg-gray-800 hover:bg-gray-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Tìm/Thêm</button>
      <button onclick="openAddModalDirectly()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1">+ Kho</button>
    </div>
  </div>

  <!-- Giỏ hàng / Đơn hàng tạp hóa -->
  <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold text-gray-800 text-sm uppercase tracking-wide">Danh Sách Đơn Hàng</h2>
      <button onclick="clearCart()" class="text-xs text-red-500 hover:underline font-medium">Xóa đơn</button>
    </div>

    <ul id="cart-list" class="divide-y text-sm max-h-56 overflow-y-auto mb-3">
      <li class="py-4 text-gray-400 text-center italic">Chưa quét sản phẩm nào</li>
    </ul>

    <div class="pt-3 border-t space-y-1">
      <div class="flex justify-between items-center text-xs text-gray-500">
        <span>Tổng số lượng:</span>
        <span id="total-qty" class="font-semibold text-gray-800">0 món</span>
      </div>
      <div class="flex justify-between items-center font-bold text-base pt-1">
        <span>Tổng tiền:</span>
        <span id="total-price" class="text-blue-600 text-lg">0 VNĐ</span>
      </div>
    </div>

    <div class="flex gap-2 mt-4">
      <button onclick="checkout()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-semibold text-sm transition shadow">
        ✅ Thanh Toán
      </button>
      <button onclick="printReceipt()" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-2.5 rounded-lg font-semibold text-sm transition shadow">
        🖨 In Bill
      </button>
    </div>
  </div>

  <!-- Nút tiện ích quản lý dữ liệu -->
  <div class="flex justify-between text-xs text-blue-600 font-medium px-1">
    <button onclick="exportCatalog()" class="hover:underline">📥 Xuất kho (JSON)</button>
    <button onclick="importCatalog()" class="hover:underline">📤 Nhập kho (JSON)</button>
  </div>

  <!-- Modal Thêm Sản Phẩm Mới -->
  <div id="add-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl p-5 w-full max-w-sm shadow-xl">
      <h3 class="font-bold text-lg text-gray-800 mb-3">Thêm sản phẩm mới</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Mã vạch sản phẩm:</label>
          <input type="text" id="modal-barcode-input" placeholder="Nhập hoặc quét mã vạch..." class="w-full border rounded-lg p-2 text-sm font-mono font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tên sản phẩm:</label>
          <input type="text" id="new-name" placeholder="VD: Mì Hảo Hảo Tôm Chua Cay" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Đơn giá (VNĐ):</label>
          <input type="number" id="new-price" placeholder="VD: 4500" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div class="flex gap-2 mt-4">
        <button onclick="saveNewProduct()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">💾 Lưu Vào DB Server</button>
        <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">Hủy</button>
      </div>
    </div>
  </div>

  <!-- Khung in hóa đơn -->
  <div id="printable-receipt" class="hidden"></div>

  <!-- Thư viện Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Script gốc của ứng dụng -->
  <script src="scanner.js"></script>
  <script src="app.js"></script>
</body>
</html>
